            # Root package (feagi-rs) has source=None; only dependency sources must be registry
            if source is not None and not (isinstance(source, str) and source.startswith("registry+")):
              bad_sources.append((name, version, source))

          if bad_sources:
            print("ERROR: Non-crates.io sources detected for feagi-* dependencies:")
            for name, version, source in bad_sources:
              print(f"  - {name} {version}: source={source!r}")
            sys.exit(1)

          print("OK: feagi-* deps resolve from crates.io registry")
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: darwin-aarch64-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            darwin-aarch64-cargo-deps-

      - name: Cache build target directory
        uses: actions/cache@v4
        with:
          path: target/aarch64-apple-darwin
          key: darwin-aarch64-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            darwin-aarch64-target-${{ hashFiles('**/Cargo.lock') }}-
            darwin-aarch64-target-

      - name: Setup sccache
        shell: bash
        run: |
          echo "📦 Installing sccache to speed up Rust builds..."
          SCCACHE_VERSION="0.12.0"
          ARCH=$(uname -m)
          if [[ "${ARCH}" == "arm64" ]]; then
            SCCACHE_ARCH="aarch64-apple-darwin"
          else
            SCCACHE_ARCH="x86_64-apple-darwin"
          fi
          curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-${SCCACHE_ARCH}.tar.gz" | tar xz
          sudo mv sccache-v${SCCACHE_VERSION}-${SCCACHE_ARCH}/sccache /usr/local/bin/
          chmod +x /usr/local/bin/sccache
          
          # Configure cargo to use sccache
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
          
          echo "✅ sccache installed and configured"

      - name: Cache sccache storage
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: darwin-aarch64-sccache-${{ github.run_id }}
          restore-keys: |
            darwin-aarch64-sccache-

      - name: Build FEAGI
        shell: bash
        run: |
          BINARY_PATH="target/aarch64-apple-darwin/release/feagi"
          
          if [ -f "$BINARY_PATH" ]; then
            echo "Binary found in cache - using cached version"
            ls -lh "$BINARY_PATH"
          else
            echo "Building from source..."
            cargo build --locked --release --target aarch64-apple-darwin
            ls -lh "$BINARY_PATH"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: feagi-darwin-aarch64
          path: target/aarch64-apple-darwin/release/feagi
          retention-days: 30

  # ============================================================================
  # Windows Build Job
  # ============================================================================
  build-windows-x86_64:
    needs: determine-config
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows == true
    steps:
      - name: Checkout feagi-rust (source repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-config.outputs.source_branch }}
          fetch-depth: 0

      - name: Disable local path patches (CI must use crates.io only)
        shell: bash
        run: |
          if [ -f ".cargo/config.toml" ]; then
            echo "Removing .cargo/config.toml so CI resolves all deps from crates.io (no path/patch)."
            rm -f ".cargo/config.toml"
          fi

      - name: Log dependency resolution context (root-cause)
        shell: bash
        run: |
          echo "=== Dependency resolution context (ref: ${{ needs.determine-config.outputs.source_branch }}) ==="
          echo ".cargo/config.toml present after patch step: $([ -f .cargo/config.toml ] && echo yes || echo no)"
          echo "Cargo.toml [patch] or path deps:"
          grep -n "\[patch" Cargo.toml 2>/dev/null || echo "  (none)"
          grep -nE "path\s*=" Cargo.toml 2>/dev/null || echo "  (no path= in Cargo.toml)"
          echo "Cargo.lock path sources for feagi-* (path+ or source with path):"
          grep -B1 "path+" Cargo.lock 2>/dev/null | head -20 || true
          (grep -A1 'name = "feagi-' Cargo.lock | grep -E "source|path" || true) | head -30
          echo "=== End context ==="

      - name: Verify feagi-* dependencies resolve from crates.io
        shell: bash
        run: |
          set -euo pipefail
          METADATA_FILE="cargo-metadata.json"
          CARGO_STDERR="$(mktemp)"
          if ! cargo metadata --locked --format-version=1 > "$METADATA_FILE" 2> "$CARGO_STDERR"; then
            echo "ERROR: cargo metadata failed (likely Cargo.lock out of date or path/patch still active)."
            echo "--- Full cargo metadata stderr ---"
            cat "$CARGO_STDERR"
            echo "--- End ---"
            echo "Fix: ensure Cargo.toml has no [patch.crates-io] and no path deps; ensure Cargo.lock is registry-only; regenerate with: cargo generate-lockfile (without .cargo/config.toml patch)."
            rm -f "$CARGO_STDERR"
            exit 1
          fi
          rm -f "$CARGO_STDERR"

          python << 'PY'
          import json
          import sys

          with open("cargo-metadata.json", "r", encoding="utf-8") as f:
            data = json.load(f)

          bad_sources = []

          for pkg in data.get("packages", []):
            name = str(pkg.get("name", ""))
            if not name.startswith("feagi-"):
              continue

            source = pkg.get("source")
            version = str(pkg.get("version", ""))

            # Root package (feagi-rs) has source=None; only dependency sources must be registry
            if source is not None and not (isinstance(source, str) and source.startswith("registry+")):
              bad_sources.append((name, version, source))

          if bad_sources:
            print("ERROR: Non-crates.io sources detected for feagi-* dependencies:")
            for name, version, source in bad_sources:
              print(f"  - {name} {version}: source={source!r}")
            sys.exit(1)

          print("OK: feagi-* deps resolve from crates.io registry")
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-x86_64-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-deps-

      - name: Cache build target directory
        uses: actions/cache@v4
        with:
          path: target/x86_64-pc-windows-msvc
          key: windows-x86_64-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            windows-x86_64-target-${{ hashFiles('**/Cargo.lock') }}-
            windows-x86_64-target-

      - name: Setup sccache
        shell: bash
        run: |
          echo "📦 Installing sccache to speed up Rust builds..."
          SCCACHE_VERSION="0.12.0"
          curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc.zip" -o sccache.zip
          unzip -q sccache.zip
          
          # Create local bin directory
          mkdir -p "$HOME/.local/bin"
          SCCACHE_DIR="$HOME/.local/bin"
          SCCACHE_EXE="$SCCACHE_DIR/sccache.exe"
          
          # Copy sccache to local bin
          cp sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc/sccache.exe "$SCCACHE_EXE"
          
          # Get absolute path (GitHub Actions on Windows uses /d/ format)
          SCCACHE_ABS=$(cd "$SCCACHE_DIR" && pwd)/sccache.exe
          
          # Add to PATH for this session and future steps
          export PATH="$SCCACHE_DIR:$PATH"
          echo "$SCCACHE_DIR" >> $GITHUB_PATH
          
          # Configure cargo to use sccache - use absolute path
          echo "RUSTC_WRAPPER=$SCCACHE_ABS" >> $GITHUB_ENV
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
          
          # Verify sccache is accessible
          "$SCCACHE_EXE" --version || echo "Warning: sccache version check failed"
          
          echo "✅ sccache installed and configured"
          echo "   Absolute path: $SCCACHE_ABS"

      - name: Cache sccache storage
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: windows-x86_64-sccache-${{ github.run_id }}
          restore-keys: |
            windows-x86_64-sccache-

      - name: Build FEAGI
        shell: bash
        run: |
          BINARY_PATH="target/x86_64-pc-windows-msvc/release/feagi.exe"
          
          if [ -f "$BINARY_PATH" ]; then
            echo "Binary found in cache - using cached version"
            ls -lh "$BINARY_PATH"
          else
            echo "Building from source..."
            cargo build --locked --release --target x86_64-pc-windows-msvc
            ls -lh "$BINARY_PATH"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: feagi-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/feagi.exe
          retention-days: 30

  # ============================================================================
  # Collect all binaries and create PR
  # ============================================================================
  create-pr:
    name: Create PR with Binaries
    needs: [determine-config, build-linux-x86_64, build-linux-aarch64, build-darwin-x86_64, build-darwin-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    # Only create PR when all builds succeed; avoid PRs with missing/partial artifacts
    if: success()

    steps:
      - name: Determine source commit
        id: source_info
        shell: bash
        run: |
          if [ -n "${{ needs.determine-config.outputs.source_sha }}" ]; then
            SOURCE_SHA="${{ needs.determine-config.outputs.source_sha }}"
          else
            SOURCE_SHA="${{ github.sha }}"
          fi
          
          SOURCE_BRANCH="${{ needs.determine-config.outputs.source_branch }}"
          
          echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Determine which platforms were built
        id: platforms
        shell: bash
        run: |
          PLATFORMS=()
          if [ -f "binaries/feagi-linux-x86_64/feagi" ]; then
            PLATFORMS+=("linux-x86_64")
          fi
          if [ -f "binaries/feagi-linux-aarch64/feagi" ]; then
            PLATFORMS+=("linux-aarch64")
          fi
          if [ -f "binaries/feagi-darwin-x86_64/feagi" ]; then
            PLATFORMS+=("darwin-x86_64")
          fi
          if [ -f "binaries/feagi-darwin-aarch64/feagi" ]; then
            PLATFORMS+=("darwin-aarch64")
          fi
          if [ -f "binaries/feagi-windows-x86_64/feagi.exe" ]; then
            PLATFORMS+=("windows-x86_64")
          fi
          
          PLATFORMS_STR=$(IFS=','; echo "${PLATFORMS[*]}")
          echo "platforms=${PLATFORMS_STR}" >> $GITHUB_OUTPUT
          echo "platform_count=${#PLATFORMS[@]}" >> $GITHUB_OUTPUT
          echo "Built platforms: ${PLATFORMS_STR}"

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: feagi/feagi
          token: ${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}
          path: public-repo
          ref: staging
          fetch-depth: 0

      - name: Create branch name
        id: branch_name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="update-binaries-manual-$(date +%Y%m%d-%H%M%S)-$(echo ${{ steps.source_info.outputs.source_sha }} | cut -c1-7)"
          else
            BRANCH_NAME="update-binaries-$(date +%Y%m%d-%H%M%S)-$(echo ${{ steps.source_info.outputs.source_sha }} | cut -c1-7)"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create and checkout branch
        shell: bash
        run: |
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Configure remote URL with token for push operations
          git remote set-url origin https://${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}@github.com/feagi/feagi.git
          git checkout -b ${{ steps.branch_name.outputs.branch_name }}

      - name: Copy binaries
        shell: bash
        run: |
          cd public-repo
          # feagi-core package data lives under feagi-python-sdk/feagi/bin/ (package "feagi" in pyproject.toml)
          BIN_ROOT="feagi-python-sdk/feagi/bin"
          
          if [ -f "../binaries/feagi-linux-x86_64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/linux-x86_64"
            cp ../binaries/feagi-linux-x86_64/feagi "${BIN_ROOT}/linux-x86_64/feagi"
            chmod +x "${BIN_ROOT}/linux-x86_64/feagi"
          fi
          
          if [ -f "../binaries/feagi-linux-aarch64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/linux-aarch64"
            cp ../binaries/feagi-linux-aarch64/feagi "${BIN_ROOT}/linux-aarch64/feagi"
            chmod +x "${BIN_ROOT}/linux-aarch64/feagi"
          fi
          
          if [ -f "../binaries/feagi-darwin-x86_64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/darwin-x86_64"
            cp ../binaries/feagi-darwin-x86_64/feagi "${BIN_ROOT}/darwin-x86_64/feagi"
            chmod +x "${BIN_ROOT}/darwin-x86_64/feagi"
          fi
          
          if [ -f "../binaries/feagi-darwin-aarch64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/darwin-aarch64"
            cp ../binaries/feagi-darwin-aarch64/feagi "${BIN_ROOT}/darwin-aarch64/feagi"
            chmod +x "${BIN_ROOT}/darwin-aarch64/feagi"
          fi
          
          if [ -f "../binaries/feagi-windows-x86_64/feagi.exe" ]; then
            mkdir -p "${BIN_ROOT}/windows-x86_64"
            cp ../binaries/feagi-windows-x86_64/feagi.exe "${BIN_ROOT}/windows-x86_64/feagi.exe"
          fi

      - name: Commit changes
        shell: bash
        run: |
          cd public-repo
          BIN_ROOT="feagi-python-sdk/feagi/bin"
          git add -f "${BIN_ROOT}/"
          
          PLATFORMS_STR="${{ steps.platforms.outputs.platforms }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_MSG="chore: update FEAGI binaries (manual trigger)

          - Built from commit: ${{ steps.source_info.outputs.source_sha }}
          - Source: ${{ github.repository }}@${{ steps.source_info.outputs.source_branch }}
          - Platforms: ${PLATFORMS_STR}
          - Triggered by: Manual workflow dispatch"
          else
            COMMIT_MSG="chore: update FEAGI binaries from main

          - Built from commit: ${{ steps.source_info.outputs.source_sha }}
          - Source: ${{ github.repository }}@${{ steps.source_info.outputs.source_branch }}
          - Platforms: ${PLATFORMS_STR}
          - Triggered by: PR #${{ github.event.pull_request.number }}"
          fi
          
          git commit -m "$COMMIT_MSG"

      - name: Push branch
        shell: bash
        run: |
          cd public-repo
          git push origin ${{ steps.branch_name.outputs.branch_name }}

      - name: Setup GitHub CLI
        shell: bash
        run: |
          gh auth login --with-token <<< "${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}"

      - name: Generate PR body
        id: pr_body
        shell: bash
        run: |
          PLATFORMS_STR="${{ steps.platforms.outputs.platforms }}"
          PLATFORM_COUNT="${{ steps.platforms.outputs.platform_count }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TRIGGER_INFO="Manual workflow dispatch"
          else
            TRIGGER_INFO="PR #${{ github.event.pull_request.number }}"
          fi
          
          cat > /tmp/pr_body.md << EOF
          ## Automated Binary Update
          
          This PR updates FEAGI binaries built from the \`${{ steps.source_info.outputs.source_branch }}\` branch of feagi-rust.
          
          ### Included Binaries
          Platforms: ${PLATFORMS_STR}
          
          ### Details
          - **Source Commit**: \`${{ steps.source_info.outputs.source_sha }}\`
          - **Source Repo**: \`${{ github.repository }}\`
          - **Source Branch**: \`${{ steps.source_info.outputs.source_branch }}\`
          - **Trigger**: $TRIGGER_INFO
          
          ### Verification
          All ${PLATFORM_COUNT} binary(ies) have been verified to exist in this branch.
          
          ---
          *This PR was automatically created by GitHub Actions*
          EOF

      - name: Create Pull Request
        id: create_pr
        shell: bash
        run: |
          PR_OUTPUT=$(gh pr create \
            --repo feagi/feagi \
            --base staging \
            --head ${{ steps.branch_name.outputs.branch_name }} \
            --title "chore: Update FEAGI binaries from ${{ steps.source_info.outputs.source_branch }}" \
            --body-file /tmp/pr_body.md) || exit 1
          
          PR_URL=$(echo "$PR_OUTPUT" | grep -o 'https://github.com/[^ ]*' | head -1)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+')
          
          echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pull-request-url=$PR_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}

  # ============================================================================
  # Disabled: direct push to staging (manual only)
  # ============================================================================
  push-binaries-to-repo:
    name: Push Binaries to feagi/feagi Repo
    needs: [determine-config, build-linux-x86_64, build-linux-aarch64, build-darwin-x86_64, build-darwin-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: feagi/feagi
          token: ${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}
          path: public-repo
          ref: staging
          fetch-depth: 0

      - name: Copy binaries
        shell: bash
        run: |
          cd public-repo
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Configure remote URL with token for push operations
          git remote set-url origin https://${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}@github.com/feagi/feagi.git
          
          BIN_ROOT="feagi-python-sdk/feagi/bin"
          if [ -f "../binaries/feagi-linux-x86_64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/linux-x86_64"
            cp ../binaries/feagi-linux-x86_64/feagi "${BIN_ROOT}/linux-x86_64/feagi"
            chmod +x "${BIN_ROOT}/linux-x86_64/feagi"
          fi
          
          if [ -f "../binaries/feagi-linux-aarch64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/linux-aarch64"
            cp ../binaries/feagi-linux-aarch64/feagi "${BIN_ROOT}/linux-aarch64/feagi"
            chmod +x "${BIN_ROOT}/linux-aarch64/feagi"
          fi
          
          if [ -f "../binaries/feagi-darwin-x86_64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/darwin-x86_64"
            cp ../binaries/feagi-darwin-x86_64/feagi "${BIN_ROOT}/darwin-x86_64/feagi"
            chmod +x "${BIN_ROOT}/darwin-x86_64/feagi"
          fi
          
          if [ -f "../binaries/feagi-darwin-aarch64/feagi" ]; then
            mkdir -p "${BIN_ROOT}/darwin-aarch64"
            cp ../binaries/feagi-darwin-aarch64/feagi "${BIN_ROOT}/darwin-aarch64/feagi"
            chmod +x "${BIN_ROOT}/darwin-aarch64/feagi"
          fi
          
          if [ -f "../binaries/feagi-windows-x86_64/feagi.exe" ]; then
            mkdir -p "${BIN_ROOT}/windows-x86_64"
            cp ../binaries/feagi-windows-x86_64/feagi.exe "${BIN_ROOT}/windows-x86_64/feagi.exe"
          fi

      - name: Commit and push binaries
        shell: bash
        run: |
          cd public-repo
          BIN_ROOT="feagi-python-sdk/feagi/bin"
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit - binaries are identical to staging branch"
          else
            VERSION="${{ needs.determine-config.outputs.version }}"
            RELEASE_TYPE="${{ needs.determine-config.outputs.release_type }}"
            
            git add -f "${BIN_ROOT}/"
            
            PLATFORMS=()
            [ -f "${BIN_ROOT}/linux-x86_64/feagi" ] && PLATFORMS+=("linux-x86_64")
            [ -f "${BIN_ROOT}/linux-aarch64/feagi" ] && PLATFORMS+=("linux-aarch64")
            [ -f "${BIN_ROOT}/darwin-x86_64/feagi" ] && PLATFORMS+=("darwin-x86_64")
            [ -f "${BIN_ROOT}/darwin-aarch64/feagi" ] && PLATFORMS+=("darwin-aarch64")
            [ -f "${BIN_ROOT}/windows-x86_64/feagi.exe" ] && PLATFORMS+=("windows-x86_64")
            PLATFORMS_STR=$(IFS=', '; echo "${PLATFORMS[*]}")
            
            if [[ "${RELEASE_TYPE}" == "dev" ]]; then
              COMMIT_MSG="chore: update FEAGI binaries for ${RELEASE_TYPE} build ${VERSION}

          - Built from: ${{ github.repository }}@${{ needs.determine-config.outputs.source_branch }}
          - Version: ${VERSION}
          - Build Type: ${RELEASE_TYPE}
          - Platforms: ${PLATFORMS_STR}"
            else
              COMMIT_MSG="chore: update FEAGI binaries for ${RELEASE_TYPE} release v${VERSION}

          - Built from: ${{ github.repository }}@${{ needs.determine-config.outputs.source_branch }}
          - Version: v${VERSION}
          - Release Type: ${RELEASE_TYPE}
          - Platforms: ${PLATFORMS_STR}"
            fi
            
            git commit -m "${COMMIT_MSG}"
            
            git push origin staging
            echo "✅ Binaries pushed to staging branch"
          fi

  # ============================================================================
  # Upload built binaries to the feagi-rs release that triggered this workflow
  # (so feagi-desktop and others can gh release download from feagi/feagi-rs).
  # Only runs when the workflow is triggered by "Publish release" (release event).
  # If triggered by "Run workflow" (workflow_dispatch), this job is skipped.
  # Requires all five build jobs to succeed; if any build fails, this job is skipped.
  # ============================================================================
  upload-release-assets-feagi-rs:
    name: Upload release assets to feagi-rs
    needs: [determine-config, build-linux-x86_64, build-linux-aarch64, build-darwin-x86_64, build-darwin-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !cancelled() && !failure()
    permissions:
      contents: write
    steps:
      - name: Checkout feagi-rs (for config file)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Install zip for Windows packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Package binaries for release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Packaging binaries for feagi-rs release v${VERSION}..."
          mkdir -p release-assets
          if [ -f "binaries/feagi-linux-x86_64/feagi" ]; then
            mkdir -p release-package-linux-x86_64
            cp binaries/feagi-linux-x86_64/feagi release-package-linux-x86_64/
            cp feagi_configuration.toml release-package-linux-x86_64/ 2>/dev/null || true
            cd release-package-linux-x86_64 && tar -czf ../release-assets/feagi-linux-x86_64-v${VERSION}.tar.gz * && cd ..
          fi
          if [ -f "binaries/feagi-linux-aarch64/feagi" ]; then
            mkdir -p release-package-linux-aarch64
            cp binaries/feagi-linux-aarch64/feagi release-package-linux-aarch64/
            cp feagi_configuration.toml release-package-linux-aarch64/ 2>/dev/null || true
            cd release-package-linux-aarch64 && tar -czf ../release-assets/feagi-linux-aarch64-v${VERSION}.tar.gz * && cd ..
          fi
          if [ -f "binaries/feagi-darwin-x86_64/feagi" ]; then
            mkdir -p release-package-darwin-x86_64
            cp binaries/feagi-darwin-x86_64/feagi release-package-darwin-x86_64/
            cp feagi_configuration.toml release-package-darwin-x86_64/ 2>/dev/null || true
            cd release-package-darwin-x86_64 && tar -czf ../release-assets/feagi-macos-x86_64-v${VERSION}.tar.gz * && cd ..
          fi
          if [ -f "binaries/feagi-darwin-aarch64/feagi" ]; then
            mkdir -p release-package-darwin-aarch64
            cp binaries/feagi-darwin-aarch64/feagi release-package-darwin-aarch64/
            cp feagi_configuration.toml release-package-darwin-aarch64/ 2>/dev/null || true
            cd release-package-darwin-aarch64 && tar -czf ../release-assets/feagi-macos-arm64-v${VERSION}.tar.gz * && cd ..
          fi
          if [ -f "binaries/feagi-windows-x86_64/feagi.exe" ]; then
            mkdir -p release-package-windows-x86_64
            cp binaries/feagi-windows-x86_64/feagi.exe release-package-windows-x86_64/
            cp feagi_configuration.toml release-package-windows-x86_64/ 2>/dev/null || true
            cd release-package-windows-x86_64 && zip -r ../release-assets/feagi-windows-x86_64-v${VERSION}.zip * && cd ..
          fi
          ls -la release-assets/
          N=$(find release-assets -type f | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "ERROR: No release assets produced. Check that all build jobs succeeded and artifacts were downloaded."
            exit 1
          fi

      - name: Upload assets to feagi-rs release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ============================================================================
  # Disabled: GitHub Release creation in feagi/feagi (manual only)
  # ============================================================================
  create-release:
    name: Create GitHub Release
    needs: [determine-config, build-linux-x86_64, build-linux-aarch64, build-darwin-x86_64, build-darwin-aarch64, build-windows-x86_64, push-binaries-to-repo]
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: write
    
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
      
      - name: Checkout feagi-rust (for config file)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-config.outputs.source_branch }}
      
      - name: Install zip for Windows packaging
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
      
      - name: Package binaries for release
        shell: bash
        run: |
          VERSION="${{ needs.determine-config.outputs.version }}"
          RELEASE_TYPE="${{ needs.determine-config.outputs.release_type }}"
          
          echo "📦 Packaging binaries for ${RELEASE_TYPE} release v${VERSION}..."
          
          mkdir -p release-assets
          
          # Package Linux x86_64
          if [ -f "binaries/feagi-linux-x86_64/feagi" ]; then
            mkdir -p release-package-linux-x86_64
            cp binaries/feagi-linux-x86_64/feagi release-package-linux-x86_64/
            cp feagi_configuration.toml release-package-linux-x86_64/ 2>/dev/null || true
            cat > release-package-linux-x86_64/README.txt <<EOF
          FEAGI v${VERSION} for Linux (x86_64)
          
          This package contains:
          - feagi: Linux binary (x86_64)
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Move 'feagi' to desired location (e.g., /usr/local/bin/)
          3. Ensure it's executable: chmod +x feagi
          4. Run: ./feagi --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-linux-x86_64
            tar -czf ../release-assets/feagi-linux-x86_64-v${VERSION}.tar.gz *
            cd ..
            echo "✅ Created feagi-linux-x86_64-v${VERSION}.tar.gz"
          fi
          
          # Package Linux aarch64
          if [ -f "binaries/feagi-linux-aarch64/feagi" ]; then
            mkdir -p release-package-linux-aarch64
            cp binaries/feagi-linux-aarch64/feagi release-package-linux-aarch64/
            cp feagi_configuration.toml release-package-linux-aarch64/ 2>/dev/null || true
            cat > release-package-linux-aarch64/README.txt <<EOF
          FEAGI v${VERSION} for Linux (ARM64)
          
          This package contains:
          - feagi: Linux binary (aarch64)
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Move 'feagi' to desired location (e.g., /usr/local/bin/)
          3. Ensure it's executable: chmod +x feagi
          4. Run: ./feagi --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-linux-aarch64
            tar -czf ../release-assets/feagi-linux-aarch64-v${VERSION}.tar.gz *
            cd ..
            echo "✅ Created feagi-linux-aarch64-v${VERSION}.tar.gz"
          fi
          
          # Package macOS Intel
          if [ -f "binaries/feagi-darwin-x86_64/feagi" ]; then
            mkdir -p release-package-darwin-x86_64
            cp binaries/feagi-darwin-x86_64/feagi release-package-darwin-x86_64/
            cp feagi_configuration.toml release-package-darwin-x86_64/ 2>/dev/null || true
            cat > release-package-darwin-x86_64/README.txt <<EOF
          FEAGI v${VERSION} for macOS (Intel x86_64)
          
          This package contains:
          - feagi: macOS binary (Intel x86_64)
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Move 'feagi' to desired location (e.g., /usr/local/bin/)
          3. Ensure it's executable: chmod +x feagi
          4. Run: ./feagi --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-darwin-x86_64
            tar -czf ../release-assets/feagi-macos-x86_64-v${VERSION}.tar.gz *
            cd ..
            echo "✅ Created feagi-macos-x86_64-v${VERSION}.tar.gz"
          fi
          
          # Package macOS Apple Silicon
          if [ -f "binaries/feagi-darwin-aarch64/feagi" ]; then
            mkdir -p release-package-darwin-aarch64
            cp binaries/feagi-darwin-aarch64/feagi release-package-darwin-aarch64/
            cp feagi_configuration.toml release-package-darwin-aarch64/ 2>/dev/null || true
            cat > release-package-darwin-aarch64/README.txt <<EOF
          FEAGI v${VERSION} for macOS (Apple Silicon ARM64)
          
          This package contains:
          - feagi: macOS binary (Apple Silicon ARM64)
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Move 'feagi' to desired location (e.g., /usr/local/bin/)
          3. Ensure it's executable: chmod +x feagi
          4. Run: ./feagi --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-darwin-aarch64
            tar -czf ../release-assets/feagi-macos-arm64-v${VERSION}.tar.gz *
            cd ..
            echo "✅ Created feagi-macos-arm64-v${VERSION}.tar.gz"
          fi
          
          # Create universal macOS binary if both Intel and Silicon exist
          if [ -f "binaries/feagi-darwin-x86_64/feagi" ] && [ -f "binaries/feagi-darwin-aarch64/feagi" ]; then
            echo "📦 Creating universal macOS binary..."
            mkdir -p release-package-darwin-universal
            cp binaries/feagi-darwin-x86_64/feagi release-package-darwin-universal/feagi-x86_64
            cp binaries/feagi-darwin-aarch64/feagi release-package-darwin-universal/feagi-arm64
            cp feagi_configuration.toml release-package-darwin-universal/ 2>/dev/null || true
            cat > release-package-darwin-universal/README.txt <<EOF
          FEAGI v${VERSION} for macOS (Universal - Intel + Apple Silicon)
          
          This package contains:
          - feagi-x86_64: macOS binary for Intel Macs
          - feagi-arm64: macOS binary for Apple Silicon Macs
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Choose the appropriate binary for your Mac:
             - Intel Macs: Use feagi-x86_64 (rename to feagi)
             - Apple Silicon: Use feagi-arm64 (rename to feagi)
          3. Move 'feagi' to desired location (e.g., /usr/local/bin/)
          4. Ensure it's executable: chmod +x feagi
          5. Run: ./feagi --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-darwin-universal
            tar -czf ../release-assets/feagi-macos-universal-v${VERSION}.tar.gz *
            cd ..
            echo "✅ Created feagi-macos-universal-v${VERSION}.tar.gz"
          fi
          
          # Package Windows
          if [ -f "binaries/feagi-windows-x86_64/feagi.exe" ]; then
            mkdir -p release-package-windows-x86_64
            cp binaries/feagi-windows-x86_64/feagi.exe release-package-windows-x86_64/
            cp feagi_configuration.toml release-package-windows-x86_64/ 2>/dev/null || true
            cat > release-package-windows-x86_64/README.txt <<EOF
          FEAGI v${VERSION} for Windows (x86_64)
          
          This package contains:
          - feagi.exe: Windows binary (x86_64)
          - feagi_configuration.toml: Configuration file
          
          Installation:
          1. Extract this archive
          2. Move 'feagi.exe' to desired location
          3. Run: feagi.exe --config feagi_configuration.toml
          
          For more information, visit: https://github.com/feagi/feagi-rust
          EOF
            cd release-package-windows-x86_64
            zip -r ../release-assets/feagi-windows-x86_64-v${VERSION}.zip *
            cd ..
            echo "✅ Created feagi-windows-x86_64-v${VERSION}.zip"
          fi
          
          echo ""
          echo "📦 Release packages created:"
          ls -lh release-assets/
      
      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          VERSION="${{ needs.determine-config.outputs.version }}"
          RELEASE_TYPE="${{ needs.determine-config.outputs.release_type }}"
          
          if [[ "${RELEASE_TYPE}" == "beta" ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "${RELEASE_TYPE}" == "alpha" ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ needs.determine-config.outputs.version }}"
          RELEASE_TYPE="${{ needs.determine-config.outputs.release_type }}"
          
          cat > release-notes.md <<EOF
          # FEAGI v${VERSION}
          
          ## Platform Support
          - ✅ Linux (x86_64)
          - ✅ Linux (ARM64)
          - ✅ macOS (Intel x86_64)
          - ✅ macOS (Apple Silicon ARM64)
          - ✅ macOS (Universal - Intel + Apple Silicon)
          - ✅ Windows (x86_64)
          
          ## Downloads
          - **Linux x86_64**: \`feagi-linux-x86_64-v${VERSION}.tar.gz\`
          - **Linux ARM64**: \`feagi-linux-aarch64-v${VERSION}.tar.gz\`
          - **macOS Intel**: \`feagi-macos-x86_64-v${VERSION}.tar.gz\`
          - **macOS Apple Silicon**: \`feagi-macos-arm64-v${VERSION}.tar.gz\`
          - **macOS Universal**: \`feagi-macos-universal-v${VERSION}.tar.gz\` (recommended for macOS)
          - **Windows**: \`feagi-windows-x86_64-v${VERSION}.zip\`
          
          ## Installation
          
          ### macOS / Linux
          \`\`\`bash
          tar -xzf feagi-macos-v${VERSION}.tar.gz
          cd feagi-macos-v${VERSION}
          chmod +x feagi
          ./feagi --config feagi_configuration.toml
          \`\`\`
          
          ### Windows
          \`\`\`powershell
          Expand-Archive feagi-windows-x86_64-v${VERSION}.zip
          cd feagi-windows-x86_64-v${VERSION}
          .\\feagi.exe --config feagi_configuration.toml
          \`\`\`
          
          ## What's Changed
          <!-- Add changelog here -->
          
          **Full Changelog**: https://github.com/feagi/feagi-rust/compare/v${VERSION}...v${VERSION}
          EOF
      
      - name: Create GitHub Release in feagi/feagi
        uses: softprops/action-gh-release@v1
        with:
          repository: feagi/feagi
          token: ${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}
          tag_name: v${{ needs.determine-config.outputs.version }}
          name: FEAGI v${{ needs.determine-config.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.FEAGI_PUBLIC_REPO_TOKEN }}
