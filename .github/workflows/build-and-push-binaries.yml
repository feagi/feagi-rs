name: Build Binaries and Create PR/Release

on:
  # Trigger on tags for releases
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*-beta.*'
      - 'v*-alpha.*'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - dev
          - alpha
          - beta
          - production
        default: dev
      
      version:
        description: 'Version number (e.g., 2.0.0 for production/beta/alpha, or leave empty for dev)'
        required: false
        type: string
      
      source_sha:
        description: 'Source commit SHA (optional, overrides branch)'
        required: false
        type: string
      source_branch:
        description: 'Source branch to build from (default: main)'
        required: false
        type: string
        default: main
      
      # Platform selection (save resources)
      build_linux_x86_64:
        description: 'Build Linux x86_64'
        required: false
        type: boolean
        default: true
      
      build_linux_aarch64:
        description: 'Build Linux ARM64'
        required: false
        type: boolean
        default: true
      
      build_macos_intel:
        description: 'Build macOS Intel (x86_64)'
        required: false
        type: boolean
        default: true
      
      build_macos_silicon:
        description: 'Build macOS Apple Silicon (ARM64)'
        required: false
        type: boolean
        default: true
      
      build_windows:
        description: 'Build Windows x86_64'
        required: false
        type: boolean
        default: true
  
  # Automatic trigger on PR merge to main
  pull_request:
    branches:
      - main
    types: [closed]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push-binaries.yml'

permissions:
  contents: write      # Required to create branches, commit, push, and create releases
  pull-requests: write # Required to create PRs

jobs:
  # Determine build configuration
  determine-config:
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.config.outputs.release_type }}
      version: ${{ steps.config.outputs.version }}
      source_branch: ${{ steps.config.outputs.source_branch }}
      source_sha: ${{ steps.config.outputs.source_sha }}
      create_release: ${{ steps.config.outputs.create_release }}
    steps:
      - name: Determine build configuration
        id: config
        run: |
          # Determine release type and version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            VERSION="${{ github.event.inputs.version }}"
            # Strip 'v' prefix if present
            VERSION="${VERSION#v}"
            SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
            SOURCE_BRANCH="${SOURCE_BRANCH:-main}"
            SOURCE_SHA="${{ github.event.inputs.source_sha }}"
            
            # Auto-generate version for dev if not provided
            if [[ "${RELEASE_TYPE}" == "dev" && -z "${VERSION}" ]]; then
              VERSION="dev-$(date +%Y%m%d-%H%M%S)"
              echo "ℹ️ Auto-generated dev version: ${VERSION}"
            fi
          elif [[ "${{ github.ref }}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_TYPE="production"
            VERSION="${GITHUB_REF#refs/tags/v}"
            SOURCE_BRANCH="main"
            SOURCE_SHA=""
          elif [[ "${{ github.ref }}" =~ refs/tags/.*-beta\. ]]; then
            RELEASE_TYPE="beta"
            VERSION="${GITHUB_REF#refs/tags/v}"
            SOURCE_BRANCH="main"
            SOURCE_SHA=""
          elif [[ "${{ github.ref }}" =~ refs/tags/.*-alpha\. ]]; then
            RELEASE_TYPE="alpha"
            VERSION="${GITHUB_REF#refs/tags/v}"
            SOURCE_BRANCH="main"
            SOURCE_SHA=""
          else
            # PR merge or other trigger - default to dev
            RELEASE_TYPE="dev"
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
            SOURCE_BRANCH="main"
            SOURCE_SHA=""
          fi
          
          # Determine if we should create a GitHub Release
          # Only create releases for production, beta, and alpha (not dev)
          if [[ "${RELEASE_TYPE}" == "production" || "${RELEASE_TYPE}" == "beta" || "${RELEASE_TYPE}" == "alpha" ]]; then
            CREATE_RELEASE="true"
          else
            CREATE_RELEASE="false"
          fi
          
          echo "release_type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "source_branch=${SOURCE_BRANCH}" >> $GITHUB_OUTPUT
          echo "source_sha=${SOURCE_SHA}" >> $GITHUB_OUTPUT
          echo "create_release=${CREATE_RELEASE}" >> $GITHUB_OUTPUT
          
          echo "📋 Build Configuration:"
          echo "   Release Type: ${RELEASE_TYPE}"
          echo "   Version: ${VERSION}"
          echo "   Source Branch: ${SOURCE_BRANCH}"
          echo "   Create Release: ${CREATE_RELEASE}"

  # ============================================================================
  # Linux x86_64 Build Job
  # ============================================================================
  build-linux-x86_64:
    needs: determine-config
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux_x86_64 == true
    steps:
      - name: Checkout feagi-rust (source repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-config.outputs.source_branch }}
          fetch-depth: 0

      - name: Disable local path patches (CI must use crates.io)
        shell: bash
        run: |
          if [ -f ".cargo/config.toml" ] && grep -q "^\[patch\.crates-io\]" ".cargo/config.toml"; then
            echo "Removing .cargo/config.toml (contains [patch.crates-io]) to force crates.io resolution"
            rm -f ".cargo/config.toml"
          fi

      - name: Verify feagi-* dependencies resolve from crates.io (and production forbids pre-release)
        shell: bash
        env:
          RELEASE_TYPE: ${{ needs.determine-config.outputs.release_type }}
        run: |
          set -euo pipefail
          METADATA_FILE="cargo-metadata.json"
          if ! cargo metadata --locked --format-version=1 > "$METADATA_FILE"; then
            echo "ERROR: cargo metadata failed (likely Cargo.lock out of date for this branch/ref)."
            echo "Fix: regenerate and commit Cargo.lock (e.g., 'cargo generate-lockfile') before running CI with --locked."
            exit 1
          fi

          python << 'PY'
          import json
          import os
          import sys

          release_type = os.environ.get("RELEASE_TYPE", "")
          with open("cargo-metadata.json", "r", encoding="utf-8") as f:
            data = json.load(f)

          bad_sources = []
          bad_prerelease = []

          for pkg in data.get("packages", []):
            name = str(pkg.get("name", ""))
            if not name.startswith("feagi-"):
              continue

            source = pkg.get("source")
            version = str(pkg.get("version", ""))

            if not (isinstance(source, str) and source.startswith("registry+")):
              bad_sources.append((name, version, source))

            if release_type == "production" and "-" in version:
              bad_prerelease.append((name, version))

          if bad_sources:
            print("ERROR: Non-crates.io sources detected for feagi-* dependencies:")
            for name, version, source in bad_sources:
              print(f"  - {name} {version}: source={source!r}")
            sys.exit(1)

          if bad_prerelease:
            print("ERROR: Production builds forbid pre-release FEAGI deps (SemVer pre-release contains '-'). Found:")
            for name, version in bad_prerelease:
              print(f"  - {name} {version}")
            sys.exit(1)

          print("OK: feagi-* deps resolve from crates.io registry")
          if release_type == "production":
            print("OK: production has no pre-release feagi-* versions")
          PY
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-x86_64-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-x86_64-cargo-deps-
      
      - name: Setup sccache
        shell: bash
        run: |
          echo "📦 Installing sccache to speed up Rust builds..."
          SCCACHE_VERSION="0.12.0"
          curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          chmod +x /usr/local/bin/sccache
          
          # Configure cargo to use sccache
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
          
          echo "✅ sccache installed and configured"
      
      - name: Cache sccache storage
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: linux-x86_64-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-x86_64-sccache-
      
      - name: Build FEAGI
        shell: bash
        run: |
          BINARY_PATH="target/x86_64-unknown-linux-gnu/release/feagi"
          
          if [ -f "$BINARY_PATH" ]; then
            echo "Binary found in cache - using cached version"
            ls -lh "$BINARY_PATH"
          else
            echo "Building from source..."
            cargo build --locked --release --target x86_64-unknown-linux-gnu
            ls -lh "$BINARY_PATH"
          fi
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: feagi-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/feagi
          retention-days: 30

