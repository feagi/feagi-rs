          if ! cargo metadata --locked --format-version=1 > "$METADATA_FILE" 2> "$CARGO_STDERR"; then
            echo "ERROR: cargo metadata failed (likely Cargo.lock out of date or path/patch still active)."
            echo "--- Full cargo metadata stderr ---"
            cat "$CARGO_STDERR"
            echo "--- End ---"
            echo "Fix: ensure Cargo.toml has no [patch.crates-io] and no path deps; ensure Cargo.lock is registry-only; regenerate with: cargo generate-lockfile (without .cargo/config.toml patch)."
            rm -f "$CARGO_STDERR"
            exit 1
          fi
          rm -f "$CARGO_STDERR"

          python3 << 'PY'
          import json
          import sys

          with open("cargo-metadata.json", "r", encoding="utf-8") as f:
            data = json.load(f)

          bad_sources = []

          for pkg in data.get("packages", []):
            name = str(pkg.get("name", ""))
            if not name.startswith("feagi-"):
              continue

            source = pkg.get("source")
            version = str(pkg.get("version", ""))

            # Root package (feagi-rs) has source=None; only dependency sources must be registry
            if source is not None and not (isinstance(source, str) and source.startswith("registry+")):
              bad_sources.append((name, version, source))

          if bad_sources:
            print("ERROR: Non-crates.io sources detected for feagi-* dependencies:")
            for name, version, source in bad_sources:
              print(f"  - {name} {version}: source={source!r}")
            sys.exit(1)

          print("OK: feagi-* deps resolve from crates.io registry")
          PY

      - name: Setup Rust with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-aarch64-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-aarch64-cargo-deps-

      - name: Cache build target directory
        uses: actions/cache@v4
        with:
          path: target/aarch64-unknown-linux-gnu
          key: linux-aarch64-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            linux-aarch64-target-${{ hashFiles('**/Cargo.lock') }}-
            linux-aarch64-target-

      - name: Configure cargo for vendored OpenSSL
        shell: bash
        run: |
          # Create .cargo/config.toml to enable vendored OpenSSL for aarch64 target
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          
          [env]
          OPENSSL_STATIC = "1"
          OPENSSL_NO_VENDOR = "0"
          EOF
          
          # Add openssl-sys with vendored feature as dependency
          # This modifies Cargo.toml so we can't use --locked
          echo "" >> Cargo.toml
          echo "[dependencies.openssl-sys]" >> Cargo.toml
          echo 'version = "0.9"' >> Cargo.toml
          echo 'features = ["vendored"]' >> Cargo.toml

      - name: Build FEAGI with vendored OpenSSL
        shell: bash
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          BINARY_PATH="target/aarch64-unknown-linux-gnu/release/feagi"
          
          if [ -f "$BINARY_PATH" ]; then
            echo "Binary found in cache - using cached version"
            ls -lh "$BINARY_PATH"
          else
            echo "Building from source with vendored OpenSSL..."
            # Can't use --locked since we modified Cargo.toml
            cargo build --release --target aarch64-unknown-linux-gnu
            ls -lh "$BINARY_PATH"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: feagi-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/feagi
          retention-days: 30

  # ============================================================================
  # macOS Intel Build Job
  # ============================================================================
  build-darwin-x86_64:
    needs: determine-config
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos_intel == true
    steps:
      - name: Checkout feagi-rust (source repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-config.outputs.source_branch }}
          fetch-depth: 0

      - name: Disable local path patches (CI must use crates.io only)
