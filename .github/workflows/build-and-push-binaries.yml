              print(f"  - {name} {version}: source={source!r}")
            sys.exit(1)

          print("OK: feagi-* deps resolve from crates.io registry")
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: darwin-x86_64-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            darwin-x86_64-cargo-deps-

      - name: Cache build target directory
        uses: actions/cache@v4
        with:
          path: target/x86_64-apple-darwin
          key: darwin-x86_64-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            darwin-x86_64-target-${{ hashFiles('**/Cargo.lock') }}-
            darwin-x86_64-target-

      - name: Setup sccache
        shell: bash
        run: |
          echo "📦 Installing sccache to speed up Rust builds..."
          SCCACHE_VERSION="0.12.0"
          ARCH=$(uname -m)
          if [[ "${ARCH}" == "arm64" ]]; then
            SCCACHE_ARCH="aarch64-apple-darwin"
          else
            SCCACHE_ARCH="x86_64-apple-darwin"
          fi
          curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-${SCCACHE_ARCH}.tar.gz" | tar xz
