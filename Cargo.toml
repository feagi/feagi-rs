[package]
name = "feagi"
version = "2.0.0"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "FEAGI - Framework for Evolutionary Artificial General Intelligence (Full Server Application)"
repository = "https://github.com/Neuraville/FEAGI-2.0"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

# FEAGI can be used as both a library (for embedding) and a binary (standalone server)
[lib]
name = "feagi"
path = "src/lib.rs"

[[bin]]
name = "feagi"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# FEAGI Core Components (crates.io)
# - Local development can override these with `feagi-rs/.cargo/config.toml` via `[patch.crates-io]`.
# - Staging should pin exact beta builds via Cargo.lock + `cargo build --locked`.
# - Main should pin exact stable builds (no `-beta.*`) via Cargo.lock + `cargo build --locked`.
feagi-npu-neural = { version = "0.0.1-beta.1" }
feagi-structures = { version = "0.0.1-beta.1" }
feagi-npu-runtime = { version = "0.0.1-beta.1", features = ["std"] }
feagi-config = { version = "0.0.1-beta.1" }
# GPU acceleration enabled by default (disable with --no-default-features)
feagi-npu-burst-engine = { version = "0.0.1-beta.1" }
feagi-brain-development = { version = "0.0.1-beta.1" }
feagi-evolutionary = { version = "0.0.1-beta.1" }
feagi-services = { version = "0.0.1-beta.1" }
feagi-api = { version = "0.0.1-beta.1" }
feagi-io = { version = "0.0.1-beta.1", features = ["websocket-transport"] }
feagi-state-manager = { version = "0.0.1-beta.1" }
feagi-npu-plasticity = { version = "0.0.1-beta.1" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"

# CLI (optional - only for standalone binary)
clap = { version = "4.5", features = ["derive"], optional = true }

# Observability
feagi-observability = { version = "0.0.1-beta.1" }
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Signal handling
ctrlc = "3.0"

# Concurrency
parking_lot = "0.12"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Memory profiling
dhat = "0.3"

# System metrics
sysinfo = "0.31"

# Testing utilities
tempfile = "3.8"

# JSON output
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Profile for profiling (debug info + optimizations)
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Profile for benchmarking
[profile.bench]
inherits = "release"

[[bench]]
name = "feagi_benchmarks"
harness = false

[[test]]
name = "profile_memory"
path = "tests/profile_memory.rs"

[[test]]
name = "profile_cpu"
path = "tests/profile_cpu.rs"

[[test]]
name = "profile_storage"
path = "tests/profile_storage.rs"

[features]
default = ["cli"]
gpu = ["feagi-npu-burst-engine/gpu"]
cli = ["dep:clap"]              # CLI dependencies (for standalone binary)
embedded = []                    # For library usage (no CLI)
no-network = ["embedded"]        # Embedded + disable network servers (future use)
