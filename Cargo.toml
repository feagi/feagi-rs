[package]
name = "feagi-runtime-server"
version = "0.2.0"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "FEAGI - Framework for Evolutionary Artificial General Intelligence (Full Server Application)"
repository = "https://github.com/feagi/feagi-rs"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

[[bin]]
name = "feagi-server"
path = "src/main.rs"

[features]

[dependencies]
feagi-core = {path = "../feagi-core"}

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Match feagi-core dev profile: smaller target/ than full DWARF (see feagi-core/Cargo.toml).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Profile for profiling (debug info + optimizations)
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Profile for benchmarking
[profile.bench]
inherits = "release"


