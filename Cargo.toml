[package]
name = "feagi-rs"
version = "0.0.35"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "FEAGI - Framework for Evolutionary Artificial General Intelligence (Full Server Application)"
repository = "https://github.com/feagi/feagi-rs"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

# FEAGI can be used as both a library (for embedding) and a binary (standalone server)
[lib]
name = "feagi"
path = "src/lib.rs"

[[bin]]
name = "feagi"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# FEAGI Core Components.
#
# These track the in-progress feagi-core rewrite, which is not published to crates.io yet,
# so they are consumed as path dependencies against a sibling `feagi-core` checkout.
feagi-npu = { path = "../feagi-core/crates/feagi-npu" }
feagi-models = { path = "../feagi-core/crates/feagi-models" }
feagi-data = { path = "../feagi-core/crates/feagi-data" }
feagi-genomic-context = { path = "../feagi-core/crates/feagi-genomic-context" }
feagi-serialization = { path = "../feagi-core/crates/feagi-serialization" }
# WebSocket transport only. ZMQ is left off because the NPU has no sensory/motor entry points yet
# (`set_sensor_data` / `get_motor_data` are unimplemented), and it would pull in the libzmq C library.
# Both directions are enabled because feagi-io's shared types reference client and server
# properties unconditionally, so it does not build with only one half.
feagi-io = { path = "../feagi-core/crates/feagi-io", default-features = false, features = [
    "websocket-transport-std",
    "feagi-server",
    "feagi-client",
] }

# Async runtime + HTTP
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# CLI (optional - only for standalone binary)
clap = { version = "4.5", features = ["derive"], optional = true }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Signal handling
ctrlc = "3.0"

# Concurrency
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Profile for profiling (debug info + optimizations)
[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
default = ["cli"]
cli = ["dep:clap"]  # CLI dependencies (for standalone binary)
embedded = []       # For library usage (no CLI)
