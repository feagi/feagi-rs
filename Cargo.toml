[package]
name = "feagi-rs"
version = "0.0.37"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "FEAGI - Framework for Evolutionary Artificial General Intelligence (Full Server Application)"
repository = "https://github.com/feagi/feagi-rs"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

# FEAGI can be used as both a library (for embedding) and a binary (standalone server)
[lib]
name = "feagi"
path = "src/lib.rs"

[[bin]]
name = "feagi"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# FEAGI Core Components.
#
# feagi-core is mid-rewrite: the split NPU crates (feagi-npu-neural, feagi-npu-runtime,
# feagi-npu-burst-engine, feagi-npu-plasticity) and feagi-structures were dissolved, and the
# replacements are not published yet. Until feagi-core 0.1.x is on crates.io these are path
# dependencies on the sibling checkout.
#
# The new NPU (`feagi-npu`, consumed through `feagi_npu::wnpu::WrappedNeuronProcessingUnit`) is
# deliberately NOT a direct dependency yet: its wrapper is still `todo!()`. Neural operations are
# served by `crate::stub_services` until it is ready. Note that `feagi-npu` still arrives
# transitively via feagi-api/feagi-brain-development/feagi-services.
feagi-config = { path = "../feagi-core/crates/feagi-config" }
feagi-brain-development = { path = "../feagi-core/crates/feagi-brain-development" }
feagi-evolutionary = { path = "../feagi-core/crates/feagi-evolutionary" }
# `connectome-io` is requested explicitly: it gates `ConnectomeService::{export,import}_connectome`,
# which `crate::stub_services` implements unconditionally.
feagi-services = { path = "../feagi-core/crates/feagi-services", features = ["connectome-io"] }
feagi-api = { path = "../feagi-core/crates/feagi-api", features = ["services"] }
feagi-io = { path = "../feagi-core/crates/feagi-io", features = ["zmq-transport", "websocket-transport-std", "feagi-server"] }
feagi-agent = { path = "../feagi-core/crates/feagi-agent", features = ["agent-server", "agent-client-asynchelper-tokio"] }
feagi-state-manager = { path = "../feagi-core/crates/feagi-state-manager" }
feagi-serialization = { path = "../feagi-core/crates/feagi-serialization" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"

# CLI (optional - only for standalone binary)
clap = { version = "4.5", features = ["derive"], optional = true }

# Observability
feagi-observability = { path = "../feagi-core/crates/feagi-observability" }
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8.23"

# Signal handling
ctrlc = "3.0"

# Concurrency
parking_lot = "0.12"

# JSON (used by agent registration / device_registrations)
serde_json = "1.0"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Memory profiling
dhat = "0.3"

# System metrics
sysinfo = "0.31"

# Testing utilities
tempfile = "3.8"

# JSON output
serde_json = "1.0"

# Example dependencies
feagi-sensorimotor = { path = "../feagi-core/crates/feagi-sensorimotor" }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Profile for profiling (debug info + optimizations)
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Profile for benchmarking
[profile.bench]
inherits = "release"

[[bench]]
name = "feagi_benchmarks"
harness = false

[[test]]
name = "profile_memory"
path = "tests/profile_memory.rs"

[[test]]
name = "profile_cpu"
path = "tests/profile_cpu.rs"

[[test]]
name = "profile_storage"
path = "tests/profile_storage.rs"

[features]
default = ["cli", "plasticity", "feagi-agent", "zmq-transport"]
gpu = []                        # Placeholder: re-point at the new NPU's GPU backend once it exists
plasticity = ["feagi-services/plasticity"]  # Neuroplasticity and STDP support (wires service-layer runtime updates)
cli = ["dep:clap"]              # CLI dependencies (for standalone binary)
embedded = []                    # For library usage (no CLI)
no-network = ["embedded"]        # Embedded + disable network servers (future use)
zmq-transport = ["feagi-io/zmq-transport"]
feagi-agent = []                 # Enable agent handler functionality
