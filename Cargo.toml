[package]
name = "feagi"
version = "2.0.0"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "FEAGI - Framework for Evolutionary Artificial General Intelligence (Full Server Application)"
repository = "https://github.com/Neuraville/FEAGI-2.0"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

# FEAGI can be used as both a library (for embedding) and a binary (standalone server)
[lib]
name = "feagi"
path = "src/lib.rs"

[[bin]]
name = "feagi"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# FEAGI Core Components (from feagi-core workspace)
# Note: feagi-types removed - functionality split into feagi-neural and feagi_data_structures
feagi-neural = { path = "../feagi-core/crates/feagi-neural" }
feagi-data-structures = { path = "../feagi-core/crates/feagi-data-structures" }
feagi-runtime = { path = "../feagi-core/crates/feagi-runtime" }
feagi-runtime-std = { path = "../feagi-core/crates/feagi-runtime-std" }
feagi-config = { path = "../feagi-core/crates/feagi-config" }
# GPU acceleration enabled by default (disable with --no-default-features)
feagi-burst-engine = { path = "../feagi-core/crates/feagi-burst-engine" }  # GPU backend needs runtime trait updates
feagi-bdu = { path = "../feagi-core/crates/feagi-bdu" }
feagi-evo = { path = "../feagi-core/crates/feagi-evo" }
feagi-services = { path = "../feagi-core/crates/feagi-services" }
feagi-api = { path = "../feagi-core/crates/feagi-api" }
feagi-io = { path = "../feagi-core/crates/feagi-io", features = ["websocket-transport"] }
feagi-state-manager = { path = "../feagi-core/crates/feagi-state-manager" }
feagi-plasticity = { path = "../feagi-core/crates/feagi-plasticity" }
feagi-connectome-serialization = { path = "../feagi-core/crates/feagi-connectome-serialization" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"

# CLI (optional - only for standalone binary)
clap = { version = "4.5", features = ["derive"], optional = true }

# Observability
feagi-observability = { path = "../feagi-core/crates/feagi-observability" }
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Signal handling
ctrlc = "3.0"

# Concurrency
parking_lot = "0.12"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Memory profiling
dhat = "0.3"

# System metrics
sysinfo = "0.31"

# Testing utilities
tempfile = "3.8"

# JSON output
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Profile for profiling (debug info + optimizations)
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Profile for benchmarking
[profile.bench]
inherits = "release"

[[bench]]
name = "feagi_benchmarks"
harness = false

[[test]]
name = "profile_memory"
path = "tests/profile_memory.rs"

[[test]]
name = "profile_cpu"
path = "tests/profile_cpu.rs"

[[test]]
name = "profile_storage"
path = "tests/profile_storage.rs"

[features]
default = ["cli"]
# gpu = ["feagi-burst-engine/gpu"]  # Temporarily disabled - GPU backend needs runtime trait updates
cli = ["dep:clap"]              # CLI dependencies (for standalone binary)
embedded = []                    # For library usage (no CLI)
no-network = ["embedded"]        # Embedded + disable network servers (future use)
